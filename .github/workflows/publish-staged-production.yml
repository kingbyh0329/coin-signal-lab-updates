name: Publish staged Coin Signal Lab update

on:
  push:
    branches:
      - 'release/**'
    paths:
      - 'release-request.json'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out staged release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, re
          request = json.loads(pathlib.Path('release-request.json').read_text(encoding='utf-8'))
          expected = {'schemaVersion','sourceVersion','targetVersion','releaseId','archiveFile'}
          if set(request) != expected or request.get('schemaVersion') != 1:
              raise SystemExit('release-request.json fields do not match schema v1')
          source=request['sourceVersion']; target=request['targetVersion']; release_id=request['releaseId']
          archive_file=request['archiveFile']
          safe=re.compile(r'^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$')
          for label,value in [('sourceVersion',source),('targetVersion',target),('releaseId',release_id)]:
              if not isinstance(value,str) or not safe.fullmatch(value):
                  raise SystemExit(f'invalid {label}')
          if target != release_id or target == source:
              raise SystemExit('targetVersion/releaseId/sourceVersion relationship is invalid')
          if archive_file != 'staging/chunks':
              raise SystemExit('automatic release archive path is not allowed')
          chunk_root=pathlib.Path(archive_file)
          chunks=sorted(chunk_root.glob('part-*.b64')) if chunk_root.is_dir() else []
          if not chunks:
              raise SystemExit('staged update archive chunks are missing')
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as handle:
              handle.write(f'SOURCE_VERSION={source}\nTARGET_VERSION={target}\nRELEASE_ID={release_id}\n')
          PY
          cat staging/chunks/part-*.b64 | base64 --decode > coin-signal-lab-next-update.zip
          test -s coin-signal-lab-next-update.zip

      - name: Install signing dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=46,<47'

      - name: Sign and validate release
        shell: bash
        env:
          CSL_RELEASE_PRIVATE_KEY: ${{ secrets.CSL_RELEASE_PRIVATE_KEY }}
          KEY_ID: release-2026
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, base64, hashlib, json, os, pathlib, stat, zipfile
          from datetime import datetime, timezone
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          archive=pathlib.Path('coin-signal-lab-next-update.zip')
          source=os.environ['SOURCE_VERSION']; target=os.environ['TARGET_VERSION']; release_id=os.environ['RELEASE_ID']
          repo=os.environ['GITHUB_REPOSITORY']; key_id=os.environ['KEY_ID']
          key=serialization.load_pem_private_key(os.environ['CSL_RELEASE_PRIVATE_KEY'].encode(),password=None)
          if not isinstance(key,Ed25519PrivateKey): raise SystemExit('production secret is not Ed25519')
          trusted=json.loads(pathlib.Path('release-public-key.json').read_text(encoding='utf-8'))
          expected_public=base64.b64decode(trusted.get('publicKey',''),validate=True)
          actual_public=key.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          if trusted.get('keyId') != key_id or actual_public != expected_public:
              raise SystemExit('production secret does not match the pinned public key')

          protected={'data','snapshots','results','checkpoints','research-data','user-data'}
          files=[]; seen=set(); total=0
          with zipfile.ZipFile(archive) as z:
              names=set(z.namelist())
              if not {'package.json','engine/coin_signal_lab/__init__.py'}.issubset(names):
                  raise SystemExit('update archive is missing version markers')
              if json.loads(z.read('package.json').decode())['version'] != target:
                  raise SystemExit('package version mismatch')
              tree=ast.parse(z.read('engine/coin_signal_lab/__init__.py').decode())
              engine=None
              for node in tree.body:
                  if isinstance(node,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='ENGINE_VERSION' for t in node.targets):
                      if isinstance(node.value,ast.Constant): engine=node.value.value
              if engine != target: raise SystemExit('engine version mismatch')
              for info in z.infolist():
                  if info.is_dir() or (info.flag_bits & 1): raise SystemExit('invalid zip entry')
                  p=info.filename.replace('\\','/'); parts=p.split('/')
                  if not p or p.startswith('/') or any(x in ('','.','..') for x in parts): raise SystemExit(f'unsafe path: {p}')
                  if parts[0].lower() in protected: raise SystemExit(f'protected path: {p}')
                  ident=p.lower()
                  if ident in seen: raise SystemExit(f'duplicate path: {p}')
                  seen.add(ident)
                  if ((info.external_attr >> 16) & 0o170000) == stat.S_IFLNK: raise SystemExit(f'symlink: {p}')
                  total += info.file_size
                  if total > 2*1024**3: raise SystemExit('archive too large')
                  files.append({'path':p,'sha256':hashlib.sha256(z.read(info)).hexdigest()})
          files.sort(key=lambda row:row['path'].lower())
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          asset='coin-signal-lab-next-update.zip'
          payload={
              'schemaVersion':1,'appId':'coin-signal-lab-next','channel':'stable','releaseId':release_id,
              'sourceVersion':source,'targetVersion':target,
              'publishedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'archiveUrl':f'https://github.com/{repo}/releases/download/{release_id}/{asset}',
              'archiveSize':archive.stat().st_size,'archiveSha256':digest,'files':files,
          }
          canonical=json.dumps(payload,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          envelope={'schemaVersion':1,'keyId':key_id,'payload':payload,'signature':base64.b64encode(key.sign(canonical)).decode()}
          pathlib.Path('stable.json').write_text(json.dumps(envelope,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Create release and upload archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_ID}" coin-signal-lab-next-update.zip \
            --target main \
            --title "Coin Signal Lab ${TARGET_VERSION}" \
            --notes 'Signed production update for Coin Signal Lab Next.'

      - name: Publish stable manifest to main
        shell: bash
        run: |
          set -euo pipefail
          cp stable.json "${RUNNER_TEMP}/stable.json"
          git config user.name 'coin-signal-lab-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          cp "${RUNNER_TEMP}/stable.json" stable.json
          git add stable.json
          git diff --cached --quiet && { echo 'stable.json did not change'; exit 3; }
          git commit -m "Publish stable ${TARGET_VERSION}"
          git push origin HEAD:main

      - name: Remove staging branch
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "${GITHUB_REF_NAME}" || true
